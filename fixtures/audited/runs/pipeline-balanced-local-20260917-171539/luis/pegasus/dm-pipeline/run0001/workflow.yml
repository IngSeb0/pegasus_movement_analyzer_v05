  - lfn: pipeline.stage2.dat
    type: output
    stageOut: false
    registerReplica: true
  - lfn: pipeline.stage1.dat
    type: input
  profiles:
    condor:
      requirements: regexp("pegasus-worker1", TARGET.Name)
  metadata:
    pattern: pipeline
    role: stage-2
    controlled_worker: worker1
    placement: balanced-local
- type: job
  name: data_task
  id: ID0000003
  arguments:
  - process
  - --input
  - pipeline.stage2.dat
  - --output
  - pipeline.stage3.dat
  uses:
  - lfn: pipeline.stage3.dat
    type: output
    stageOut: true
    registerReplica: true
  - lfn: pipeline.stage2.dat
    type: input
  profiles:
    condor:
      requirements: regexp("pegasus-worker2", TARGET.Name)
